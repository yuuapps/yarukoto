<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="やること帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<script>window.APP_VER="1.1.0";</script>
</head><body>
<title>やること帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first single-screen app — header / scrolling body / bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#f6f7f6; --surface:#ffffff; --surface2:#edf1ef; --line:#dde3e0; --fg:#1b2422; --muted:#64706d;
  --accent:#0d7668; --accent-ink:#ffffff; --accent-soft:#dcefea;
  --p1:#d1453b; --p2:#dd8418; --p3:#2f6fd6; --p4:#8a9391;
  --d-over:#cc3d33; --d-today:#0b8a4c; --d-tom:#b8720c; --d-week:#7148c7; --d-later:#64706d;
  --shadow:0 10px 30px rgba(18,38,34,.16); --scrim:rgba(14,24,22,.38);
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gy:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191f1e; --surface2:#222a28; --line:#2c3533; --fg:#e4ebe9; --muted:#93a09c;
  --accent:#40bea8; --accent-ink:#08201c; --accent-soft:#153430;
  --p1:#ff6a5e; --p2:#f3a43c; --p3:#6aa2ff; --p4:#7c8784;
  --d-over:#ff6a5e; --d-today:#4fcf8c; --d-tom:#efb24d; --d-week:#b195ff; --d-later:#93a09c;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191f1e; --surface2:#222a28; --line:#2c3533; --fg:#e4ebe9; --muted:#93a09c;
  --accent:#40bea8; --accent-ink:#08201c; --accent-soft:#153430;
  --p1:#ff6a5e; --p2:#f3a43c; --p3:#6aa2ff; --p4:#7c8784;
  --d-over:#ff6a5e; --d-today:#4fcf8c; --d-tom:#efb24d; --d-week:#b195ff; --d-later:#93a09c;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark}

html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:14px;height:14px;stroke-width:2}
svg.i.lg{width:24px;height:24px}

#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
#app.wide{max-width:1240px}
.top{padding-left:var(--gx);padding-right:var(--gy);padding-block:8px 4px;display:flex;flex-direction:column;gap:2px}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font-size:28px;font-weight:800;letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.top h1 .dot{width:12px;height:12px;border-radius:50%;flex:none}
.sub{color:var(--muted);font-size:13px;min-height:0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:active{background:var(--surface2)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{width:36px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gx);padding-right:var(--gy);padding-block:4px 110px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main.board-mode{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:var(--gx);padding-right:var(--gy);padding-block:5px 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600}
.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
#fab{position:absolute;right:max(18px, calc(env(safe-area-inset-right, 0px) + 12px));bottom:76px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
#fab svg{width:28px;height:28px;stroke-width:2.2}
#fab:active{transform:scale(.94)}

/* groups & rows */
.group{margin-top:14px}
.ghead{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.ghead .gsub{color:var(--muted);font-weight:500;font-size:12.5px}
.ghead .gact{margin-left:auto;color:var(--accent);font-weight:600;font-size:13px}
.ghead .gcount{color:var(--muted);font-weight:500;font-size:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ghead.over{color:var(--d-over)}
.task{display:flex;gap:10px;padding:10px 0 10px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer;position:relative}
.task.depth1{padding-left:30px}.task.depth2{padding-left:60px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--p4);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;transition:background .15s}
.check svg{width:14px;height:14px;stroke-width:2.6}
.pr1 .check{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent)}
.pr2 .check{border-color:var(--p2);background:color-mix(in srgb,var(--p2) 12%,transparent)}
.pr3 .check{border-color:var(--p3);background:color-mix(in srgb,var(--p3) 12%,transparent)}
.check:hover{color:var(--muted)}
.task.done .check,.check.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.task.leaving{opacity:.35;transition:opacity .25s}
.tbody{flex:1;min-width:0}
.ttitle{overflow-wrap:anywhere}
.tdesc{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.tmeta span{display:inline-flex;align-items:center;gap:3px}
.tproj{margin-left:auto}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.due-over{color:var(--d-over)}.due-today{color:var(--d-today)}.due-tom{color:var(--d-tom)}.due-week{color:var(--d-week)}.due-later{color:var(--d-later)}
.lbl{color:var(--muted)}
.addrow{display:flex;align-items:center;gap:10px;padding:10px 0;color:var(--muted);width:100%;text-align:left}
.addrow svg{color:var(--accent)}
.addrow:active{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 12px 24px}
.empty svg{width:64px;height:64px;stroke-width:1.2;color:var(--accent);opacity:.7}
.empty h3{color:var(--fg);margin:10px 0 4px;font-size:17px}
.empty p{margin:0 auto;max-width:28em;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:11px;background:var(--surface2);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--p1)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.welcome{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.welcome h3{margin:0;font-size:16px}
.welcome p{margin:0;color:var(--muted);font-size:13.5px}
.welcome .row{display:flex;gap:8px;flex-wrap:wrap}
.banner{margin-top:8px;font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 12px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.week button{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;font-size:11px;color:var(--muted)}
.week button b{font-size:17px;color:var(--fg);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.week button.is-today b{color:var(--accent)}
.week button .wdot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px;opacity:0}
.week button.has .wdot{opacity:1}
.week button.sun{color:var(--p1)}.week button.sat{color:var(--p3)}

/* board */
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:6px 0 100px;scroll-snap-type:x proximity}
.col{flex:0 0 min(84vw,290px);display:flex;flex-direction:column;min-height:0;scroll-snap-align:start;background:var(--surface2);border-radius:16px;padding:8px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;font-weight:700;font-size:14px}
.colhead .gcount{color:var(--muted);font-weight:500;font-size:12px}
.colhead .icon-btn{width:30px;height:30px;margin-left:auto}
.colbody{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px;flex:1}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.bcard.dragging{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:var(--shadow);transform:rotate(2deg);opacity:.95}
.dropmark{height:3px;border-radius:2px;background:var(--accent)}
.newcol{flex:0 0 200px;align-self:flex-start;background:transparent;border:1.5px dashed var(--line);color:var(--muted);height:52px;border-radius:14px;font-weight:600}

/* calendar */
.calnav{display:flex;align-items:center;gap:6px;margin-top:6px}
.calnav h2{margin:0;font-size:17px;flex:1;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:6px}
.cal .wh{font-size:11px;text-align:center;color:var(--muted);padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface2)}
.cal .wh.sun,.cday.sun .dn{color:var(--p1)}.cal .wh.sat,.cday.sat .dn{color:var(--p3)}
.cday{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);min-width:0;overflow:hidden}
.cday.out{background:var(--bg)}.cday.out .dn{opacity:.45}
.cday .dn{font-size:12px;font-weight:600;font-family:var(--f-num);font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cday.is-today .dn{background:var(--accent);color:var(--accent-ink)!important}
.cday.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.citem{font-size:10.5px;line-height:1.3;padding:1px 4px;border-radius:4px;background:var(--surface2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--p4)}
.citem.pr1{border-left-color:var(--p1)}.citem.pr2{border-left-color:var(--p2)}.citem.pr3{border-left-color:var(--p3)}
.cmore{font-size:10px;color:var(--muted);padding-left:4px}

/* browse */
.blist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.bitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.bitem:last-child{border-bottom:0}
.bitem .bname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .bnum{color:var(--muted);font-size:13px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bitem .chev{color:var(--muted)}
.bitem:active{background:var(--surface2)}
.bsec{display:flex;align-items:center;margin-top:20px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.bsec button{margin-left:auto;color:var(--accent);display:flex;align-items:center;gap:2px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;height:42px;margin-top:6px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.mode-note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600}
.chart{margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}.chart .bar.low{fill:var(--p4)}
.chart .goal{stroke:var(--d-tom);stroke-dasharray:4 3;stroke-width:1.2}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--surface2);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ev .evt{color:var(--muted);font-size:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;width:40px;flex:none;padding-top:1px}
.ev .evi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.ev .evi svg{width:13px;height:13px;stroke-width:2.2}
.ev.complete .evi{background:var(--accent-soft);color:var(--accent)}
.ev.delete .evi{color:var(--p1)}
.ev .evb{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .evb small{display:block;color:var(--muted);font-size:12px}

/* sheets */
#layer{position:fixed;inset:0;z-index:30}
#layer .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:640px;max-height:calc(100% - 40px - var(--kb,0px));background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-in{overflow-y:auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:8px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:4px 0 0;font-size:18px}
.sheet .hint{color:var(--muted);font-size:12.5px;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none;min-height:44px;line-height:1.45}
.qa-input{border:0;background:transparent;padding:4px 0;font-size:18px;font-weight:600;outline:none;width:100%}
.qa-desc{border:0;background:transparent;padding:0;font-size:14px;color:var(--muted);outline:none;width:100%}
.pchips{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
.pchip{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pchip.warn{background:var(--surface2);color:var(--muted)}
.qa-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.qa-bar select,.qa-bar input{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:14px;max-width:46%}
.qa-bar .grow{flex:1}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 130px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.prio{display:flex;gap:6px}
.prio button{flex:1;height:36px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13px}
.prio button[aria-pressed="true"]{border-color:currentColor;background:var(--surface2)}
.prio .f1{color:var(--p1)}.prio .f2{color:var(--p2)}.prio .f3{color:var(--p3)}.prio .f4{color:var(--muted)}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.detail-title{display:flex;gap:12px;align-items:flex-start}
.detail-title textarea{flex:1;border:0;background:transparent;font-size:19px;font-weight:700;outline:none;resize:none;padding:0;min-width:0}
.subs .task{padding:8px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.foot .meta{font-size:11.5px;color:var(--muted);width:100%}
.opt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;font-size:15px}
.opt:last-child{border-bottom:0}
.opt .ov{margin-left:auto;color:var(--muted);font-size:13px}
.opt.danger{color:var(--p1)}
.opt[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--fg)}
.err{color:var(--p1);font-size:12.5px;min-height:1em}
.help{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;line-height:1.7}
.help code{font-family:ui-monospace,Menlo,monospace;background:var(--surface);padding:0 4px;border-radius:4px;color:var(--fg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast button{color:var(--accent-soft);font-weight:700}
.loading{display:grid;place-items:center;height:60%;color:var(--muted)}
@media (min-width:900px){ .col{flex-basis:300px} }

const APP_VER=window.APP_VER||'1.0.0';
/* ========= utilities ========= */

const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const addDays=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d);};

/* ========= sound ========= */
const Sound={ctx:null,
  enabled(){ return !S.meta||S.meta.sound!==false; },
  unlock(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!Sound.ctx) Sound.ctx=new AC(); if(Sound.ctx.state==='suspended') Sound.ctx.resume(); }catch(e){} },
  tone(f,st,dur,vol,type='sine',slide){
    const c=Sound.ctx,t=c.currentTime+st,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur*0.6);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  },
  play(kind){
    if(!Sound.enabled()) return; Sound.unlock(); if(!Sound.ctx) return;
    try{
      if(kind==='add'){ Sound.tone(620,0,0.13,0.16,'triangle',990); }
      else { Sound.tone(1318.5,0,0.22,0.15); Sound.tone(2637,0,0.12,0.03); Sound.tone(1975.5,0.085,0.42,0.14); Sound.tone(3951,0.085,0.2,0.025); }
    }catch(e){}
  }
};
document.addEventListener('pointerdown',Sound.unlock,{passive:true});

/* ========= state ========= */
const S={ready:false,tasks:new Map(),meta:null,activity:new Map()};
const DEFAULT_META=()=>({
  v:1,goal:5,welcomeDone:false,prefs:{},
  projects:[
    {id:'inbox',name:'インボックス',color:'gray',sections:[]},
    {id:newId(),name:'仕事',color:'teal',sections:[{id:newId(),name:'進行中'},{id:newId(),name:'次にやる'},{id:newId(),name:'いつか'}]},
    {id:newId(),name:'プライベート',color:'orange',sections:[]}],
  labels:[{id:newId(),name:'待ち',color:'orange'},{id:newId(),name:'電話',color:'blue'},{id:newId(),name:'起案',color:'purple'},{id:newId(),name:'外出',color:'green'}],
  filters:[
    {id:newId(),name:'優先度が高い',query:'p1 | p2',color:'red'},
    {id:newId(),name:'回答待ち',query:'@待ち',color:'orange'},

function normalizeMeta(m){
  m.projects=m.projects||[];m.labels=m.labels||[];m.filters=m.filters||[];m.prefs=m.prefs||{};
  if(!m.projects.find(p=>p.id==='inbox')) m.projects.unshift({id:'inbox',name:'インボックス',color:'gray',sections:[]});
  m.projects.forEach(p=>p.sections=p.sections||[]);
  if(!m.goal) m.goal=5;
  return m;
}
const proj=id=>S.meta.projects.find(p=>p.id===id);
const label=id=>S.meta.labels.find(l=>l.id===id);
const filt=id=>S.meta.filters.find(f=>f.id===id);
const section=(pid,sid)=>proj(pid)?.sections.find(s=>s.id===sid);

/* ========= persistence ========= */
const Store={mode:'loading',db:null,uid:null,refs:{}};
const pendingTasks=new Map(), pendingAct=new Map(); let pendingMeta=false;
const queues=new Map(); let inflight=0; const waiters=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function slot(){ if(inflight<4){inflight++;return;} await new Promise(r=>waiters.push(r)); inflight++; }
function release(){ inflight--; const w=waiters.shift(); if(w) w(); }
function enqueue(ref,op,data,onIdle){
  let q=queues.get(ref.path);
  if(!q){q={running:false,next:null,onIdle:null};queues.set(ref.path,q);}
  q.next={ref,op,data};q.onIdle=onIdle;
  if(!q.running) drain(q);
}
async function drain(q){
  q.running=true;
  while(q.next){
    const w=q.next;q.next=null;
    await slot();
    try{ await runWrite(w); }
    catch(e){
      if(e&&e.code==='unavailable'){ await sleep(400+Math.random()*800); try{await runWrite(w);}catch(e2){writeErr(e2);} }
      else writeErr(e);
    } finally { release(); }
  }
  q.running=false; if(q.onIdle) q.onIdle();
}
const runWrite=w=>w.op==='set'?w.ref.set(w.data):w.ref.delete();
let lastErrAt=0;
function writeErr(e){
  if(Date.now()-lastErrAt<4000) return; lastErrAt=Date.now();
  const c=e&&e.code;
  toast(c==='quota_exceeded'?'保存容量の上限に達しました。完了済みタスクを削除してください':
        c==='resource_exhausted'?'書き込みが集中しています。少し待ってから操作してください':
        c==='revoked'?'保存先への接続が切れました。ページを開き直してください':
        '保存できませんでした。通信状態を確認してください');
}
const LS_KEY='yarukoto.v1'; let lsTimer=0;
function lsLoad(){ try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;} }
function lsSaveSoon(){
  clearTimeout(lsTimer);
  lsTimer=setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY,JSON.stringify({meta:S.meta,tasks:[...S.tasks.values()],activity:Object.fromEntries(S.activity)})); }
    catch(e){ toast('この端末に保存できませんでした（ブラウザの保存領域を確認してください）'); }
  },250);
}
const Persist={
  putTask(t){
    t.updatedAt=Date.now(); S.tasks.set(t.id,t);
    if(Store.mode==='db'){ const d=clone(t); pendingTasks.set(t.id,d); enqueue(Store.refs.tasks.doc(t.id),'set',d,()=>pendingTasks.delete(t.id)); }
    else lsSaveSoon();
  },
  delTask(id){
    S.tasks.delete(id);
    if(Store.mode==='db'){ pendingTasks.set(id,null); enqueue(Store.refs.tasks.doc(id),'delete',null,()=>pendingTasks.delete(id)); }
    else lsSaveSoon();
  },
  putMeta(){
    if(Store.mode==='db'){ pendingMeta=true; enqueue(Store.refs.meta,'set',clone(S.meta),()=>{pendingMeta=false;}); }
    else lsSaveSoon();
  },
  log(type,t,detail){
    const ev={t:Date.now(),type,id:t?t.id:'',title:t?t.title:'',pid:t?t.projectId:'',d:detail||''};
    const k=ymd(new Date()).slice(0,7);
    let arr=(S.activity.get(k)||[]).slice(); arr.push(ev); if(arr.length>1800) arr=arr.slice(-1800);
    S.activity.set(k,arr);
    if(Store.mode==='db'){ pendingAct.set(k,arr); enqueue(Store.refs.act.doc(k),'set',{events:arr},()=>pendingAct.delete(k)); }
    else lsSaveSoon();
  }
};
async function boot(){
  renderChrome();
  let db=null,user=null,uid=null;
  if(window.claude&&typeof window.claude.use==='function'){
    try{ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); }catch(e){}
    if(db&&user){ try{ uid=await user.id(); }catch(e){} }
  }
  if(db&&uid) startDb(db,uid); else startLocal();
}
function startLocal(){
  Store.mode='local';
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const d=lsLoad();
  S.meta=normalizeMeta(d&&d.meta?d.meta:DEFAULT_META());
  (d&&d.tasks||[]).forEach(t=>S.tasks.set(t.id,t));
  Object.entries(d&&d.activity||{}).forEach(([k,v])=>S.activity.set(k,v));
  if(!d) lsSaveSoon();
  S.ready=true; render();
}
function startDb(db,uid){
  Store.mode='db';Store.db=db;Store.uid=uid;
  const R=Store.refs;
  R.meta=db.doc(`data/users/${uid}/meta`);
  const root=db.doc(`data/users/${uid}/app`);
  R.tasks=root.collection('tasks'); R.act=root.collection('activity');
  let metaOk=false,tasksOk=false,initWritten=false;
  const ready=()=>{ if(metaOk&&tasksOk&&!S.ready){S.ready=true;} render(); };
  R.meta.onSnapshot(s=>{
    if(!s.exists){
      if(s.metadata.fromCache) return;
      if(!initWritten){ initWritten=true; S.meta=DEFAULT_META(); Persist.putMeta(); }
    } else if(!pendingMeta){ S.meta=normalizeMeta(clone(s.data())); }
    metaOk=!!S.meta; ready();
  },dbErr);
  R.tasks.onSnapshot(s=>{
    const m=new Map(); s.docs.forEach(d=>{const x=d.data(); if(x) m.set(d.id,clone(x));});
    for(const [id,v] of pendingTasks){ if(v===null) m.delete(id); else m.set(id,v); }
    S.tasks=m; tasksOk=true; if(!dragState) ready();
  },dbErr);
  R.act.onSnapshot(s=>{
    const m=new Map(); s.docs.forEach(d=>m.set(d.id,((d.data()||{}).events||[]).slice()));
    for(const [k,v] of pendingAct) m.set(k,v);
    S.activity=m; if(S.ready&&V.type==='activity') render();
  },dbErr);
}
function dbErr(e){ if(e&&e.code==='revoked') toast('保存先への接続が切れました。ページを開き直してください'); else toast('データの同期が止まりました。ページを開き直してください'); }

/* ========= natural-language quick add ========= */
const WDMAP={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
function firstOcc(r,base){
  const d=pYmd(base),wd=d.getDay();
  switch(r.freq){
    case 'day': return base;
    case 'weekday': return (wd===0||wd===6)?nextOcc(r,base):base;
    case 'week': return r.days.includes(wd)?base:nextOcc({...r,n:1},base);
    case 'month': { const day=Math.min(r.dom,dim(d.getFullYear(),d.getMonth())); const c=ymd(new Date(d.getFullYear(),d.getMonth(),day)); return c>=base?c:nextOcc(r,c); }
    case 'monthEnd': return ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
    default: return base;
  }
}
function nextOcc(r,from){
  const d=pYmd(from),n=r.n||1;
  switch(r.freq){
    case 'day': return addDays(from,n);
    case 'weekday': { let x=addDays(from,1); while([0,6].includes(pYmd(x).getDay())) x=addDays(x,1); return x; }
    case 'week': {
      const days=(r.days&&r.days.length?r.days:[d.getDay()]).map(x=>(x+6)%7).sort((a,b)=>a-b);
      const w=(d.getDay()+6)%7, later=days.find(x=>x>w);
      if(later!==undefined) return addDays(from,later-w);
      return addDays(addDays(from,-w),7*n+days[0]);
    }
    case 'month': { const y=d.getFullYear(),m=d.getMonth()+n; const day=Math.min(r.dom||d.getDate(),dim(y,m)); return ymd(new Date(y,m,day)); }
    case 'monthEnd': return ymd(new Date(d.getFullYear(),d.getMonth()+n+1,0));
    case 'year': { const y=d.getFullYear()+n; return ymd(new Date(y,d.getMonth(),Math.min(d.getDate(),dim(y,d.getMonth())))); }
  }
  return addDays(from,1);
}
function recurLabel(r){
  if(!r) return '';
  const n=r.n||1;
  switch(r.freq){
    case 'day': return n===1?'毎日':`${n}日ごと`;
    case 'weekday': return '平日';
    case 'week': { const ds=(r.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>WD[x]).join('・'); return (n===2?'隔週':n>2?`${n}週ごと`:'毎週')+(ds?ds+'曜':''); }
    case 'month': return (n===1?'毎月':`${n}か月ごと`)+(r.dom?`${r.dom}日`:'');
    case 'monthEnd': return '毎月末';
    case 'year': return '毎年';
  }
  return '';
}
function parseRecur(s){
  let m;
  const wdays=str=>[...str.matchAll(/[月火水木金土日]/g)].map(x=>WDMAP[x[0]]);
  if((m=s.match(/毎日|every ?day/i))) return {r:{freq:'day',n:1},m:m[0]};
  if((m=s.match(/(\d+)日(ごと|おき)/))) return {r:{freq:'day',n:+m[1]+(m[2]==='おき'?1:0)},m:m[0]};
  if((m=s.match(/毎?平日|every ?weekday/i))) return {r:{freq:'weekday',n:1},m:m[0]};
  if((m=s.match(/(隔週|毎週)((?:[月火水木金土日][・、,と]?)+)曜?日?/))) return {r:{freq:'week',n:m[1]==='隔週'?2:1,days:wdays(m[2])},m:m[0]};
  if((m=s.match(/隔週|毎週|every ?week/i))) return {r:{freq:'week',n:m[0]==='隔週'?2:1,days:[]},m:m[0]};
  if((m=s.match(/毎月末|月末ごと/))) return {r:{freq:'monthEnd',n:1},m:m[0]};
  if((m=s.match(/毎月(\d{1,2})日/))) return {r:{freq:'month',n:1,dom:+m[1]},m:m[0]};
  if((m=s.match(/毎月|every ?month/i))) return {r:{freq:'month',n:1,dom:0},m:m[0]};
  if((m=s.match(/毎年|every ?year/i))) return {r:{freq:'year',n:1},m:m[0]};
  return null;
}
function parseDate(s,base){
  let m; const b=pYmd(base), y=b.getFullYear();
  const fix=(mo,da,yy)=>{ let d=new Date(yy??y,mo-1,da); if(yy==null&&ymd(d)<base) d=new Date(y+1,mo-1,da); return ymd(d); };
  if((m=s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?/))) return {d:fix(+m[2],+m[3],+m[1]),m:m[0]};
  if((m=s.match(/(\d{1,2})月(\d{1,2})日/))) return {d:fix(+m[1],+m[2]),m:m[0]};
  if((m=s.match(/(?<![\d\/:])(\d{1,2})\/(\d{1,2})(?![\d\/])/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31) return {d:fix(+m[1],+m[2]),m:m[0]};
  if((m=s.match(/明後日|あさって/))) return {d:addDays(base,2),m:m[0]};
  if((m=s.match(/今日|きょう|\btoday\b/i))) return {d:base,m:m[0]};
  if((m=s.match(/明日|あした|あす|\btomorrow\b/i))) return {d:addDays(base,1),m:m[0]};
  if((m=s.match(/(\d+)日後/))) return {d:addDays(base,+m[1]),m:m[0]};
  if((m=s.match(/(\d+)週間後/))) return {d:addDays(base,7*m[1]),m:m[0]};
  if((m=s.match(/(\d+)[かヶケカ]月後/))) { const d=new Date(b.getFullYear(),b.getMonth()+ +m[1],1); d.setDate(Math.min(b.getDate(),dim(d.getFullYear(),d.getMonth()))); return {d:ymd(d),m:m[0]}; }
  if((m=s.match(/(今週の?|来週の?|再来週の?|次の|今度の)?([月火水木金土日])曜日?/))){
    const w=WDMAP[m[2]], mon=mondayOf(base), wi=(w+6)%7;
    let d;
    if(m[1]&&m[1].startsWith('今週')) d=addDays(mon,wi);
    else if(m[1]&&m[1].startsWith('来週')) d=addDays(mon,7+wi);
    else if(m[1]&&m[1].startsWith('再来週')) d=addDays(mon,14+wi);
    else { const cur=b.getDay(); let k=(w-cur+7)%7; d=addDays(base,k); }
    return {d,m:m[0]};
  }
  if((m=s.match(/今週末|週末/))) { const k=(6-b.getDay()+7)%7; return {d:addDays(base,k),m:m[0]}; }
  if((m=s.match(/再来週/))) return {d:addDays(mondayOf(base),14),m:m[0]};
  if((m=s.match(/来週/))) return {d:addDays(mondayOf(base),7),m:m[0]};
  if((m=s.match(/来月/))) return {d:ymd(new Date(b.getFullYear(),b.getMonth()+1,1)),m:m[0]};
  if((m=s.match(/月末/))) return {d:ymd(new Date(b.getFullYear(),b.getMonth()+1,0)),m:m[0]};
  return null;
}
function parseTime(s){
  let m;
  if((m=s.match(/(午前|午後|朝|夕方|夜)?\s?(\d{1,2})[:：](\d{2})(?!\d)/))){ let h=+m[2]; if(/午後|夕方|夜/.test(m[1]||'')&&h<12) h+=12; if(h<24&&+m[3]<60) return {t:`${pad(h)}:${m[3]}`,m:m[0]}; }
  if((m=s.match(/(午前|午後|朝|夕方|夜)?(\d{1,2})時(半|(\d{1,2})分)?(?!間)/))){ let h=+m[2]; if(/午後|夕方|夜/.test(m[1]||'')&&h<12) h+=12; const mi=m[3]==='半'?30:(m[4]?+m[4]:0); if(h<24&&mi<60) return {t:`${pad(h)}:${pad(mi)}`,m:m[0]}; }
  return null;
}
function parseQuick(text,base=T()){
  let s=' '+text+' '; const out={tokens:[]};
  const cut=str=>{ s=s.replace(str,' '); };
  let m;
  if((m=s.match(/\s[pP]([1-4])(?=\s)/))){ out.priority=+m[1]; out.tokens.push(['flag',`優先度${m[1]}`]); cut(m[0]); }
  if((m=s.match(/#([^\s#@]+)/))){ out.projectName=m[1]; cut(m[0]); }
  out.labelNames=[]; for(const x of [...s.matchAll(/@([^\s#@]+)/g)]){ out.labelNames.push(x[1]); }
  s=s.replace(/@([^\s#@]+)/g,' ');
  const r=parseRecur(s); if(r){ out.recur=r.r; cut(r.m); }
  const d=parseDate(s,base); if(d){ out.due=d.d; cut(d.m); }
  const t=parseTime(s); if(t){ out.time=t.t; cut(t.m); }
  if(out.recur){
    if(out.recur.freq==='week'&&!out.recur.days.length) out.recur.days=[pYmd(out.due||base).getDay()];
    if(out.recur.freq==='month'&&!out.recur.dom) out.recur.dom=pYmd(out.due||base).getDate();
    if(!out.due) out.due=firstOcc(out.recur,base);
  }
  if(out.time&&!out.due) out.due=base;
  out.title=s.replace(/\s+/g,' ').trim();
  return out;
}

/* ========= filter query language ========= */
function compileFilter(q){
  const src=q.trim(); let i=0;
  const peek=()=>{ while(src[i]===' '||src[i]==='　') i++; return src[i]; };
  function atomText(){ let st=i; while(i<src.length&&!'&|()!'.includes(src[i])) i++; return src.slice(st,i).trim(); }
  function factor(){
    const c=peek();
    if(c==='!'){ i++; const f=factor(); return t=>!f(t); }
    if(c==='('){ i++; const e=expr(); if(peek()!==')') throw new Error('「)」が足りません'); i++; return e; }
    const a=atomText(); if(!a) throw new Error('条件が空です'); return atom(a);
  }
  function term(){ let f=factor(); while(peek()==='&'){ i++; const g=factor(),h=f; f=t=>h(t)&&g(t);} return f; }
  function expr(){ let f=term(); while(peek()==='|'){ i++; const g=term(),h=f; f=t=>h(t)||g(t);} return f; }
  if(!src) throw new Error('条件を入力してください');
  const fn=expr(); if(peek()!==undefined) throw new Error(`「${src.slice(i)}」を読み取れません`);
  return fn;
}
function atom(a){
  const x=a.toLowerCase(); let m;
  const td=T();
  if(/^(今日|today)$/.test(x)) return t=>t.due===td;
  if(/^(明日|tomorrow)$/.test(x)) return t=>t.due===addDays(td,1);
  if(/^(期限切れ|overdue|od)$/.test(x)) return t=>!!t.due&&t.due<td;
  if(/^(期限なし|日付なし|no ?date)$/.test(x)) return t=>!t.due;
  if(/^(期限あり|日付あり)$/.test(x)) return t=>!!t.due;
  if(/^(今週|this ?week)$/.test(x)){ const mo=mondayOf(td),su=addDays(mo,6); return t=>!!t.due&&t.due>=mo&&t.due<=su; }
  if(/^(来週|next ?week)$/.test(x)){ const mo=addDays(mondayOf(td),7),su=addDays(mo,6); return t=>!!t.due&&t.due>=mo&&t.due<=su; }
  if((m=x.match(/^(\d+)日以内$/))||(m=x.match(/^next (\d+) days$/))){ const e=addDays(td,+m[1]); return t=>!!t.due&&t.due>=td&&t.due<=e; }
  if((m=x.match(/^p([1-4])$/))) return t=>t.priority===+m[1];
  if(/^(繰り返し|recurring)$/.test(x)) return t=>!!t.recur;
  if(/^(時刻あり)$/.test(x)) return t=>!!t.time;
  if(/^(サブタスク|subtask)$/.test(x)) return t=>!!t.parentId;
  if(/^(ラベルなし|no ?labels?)$/.test(x)) return t=>!(t.labels||[]).length;
  if(/^(すべて|全て|all)$/.test(x)) return ()=>true;
  if(/^(完了)$/.test(x)) return t=>!!t.done;
  if((m=a.match(/^(?:検索|search)[:：](.+)$/i))){ const w=m[1].trim().toLowerCase(); return t=>(t.title+' '+(t.desc||'')).toLowerCase().includes(w); }
  if((m=a.match(/^@(.+)$/))){ const l=S.meta.labels.find(l=>l.name.toLowerCase()===m[1].toLowerCase()); if(!l) throw new Error(`ラベル「${m[1]}」がありません`); return t=>(t.labels||[]).includes(l.id); }
  if((m=a.match(/^#(.+)$/))){ const p=S.meta.projects.find(p=>p.name.toLowerCase()===m[1].toLowerCase()); if(!p) throw new Error(`プロジェクト「${m[1]}」がありません`); return t=>t.projectId===p.id; }
  throw new Error(`「${a}」は使えない条件です`);
}

/* ========= task helpers ========= */
const all=()=>[...S.tasks.values()];
const activeTasks=()=>all().filter(t=>!t.done);
const childrenOf=id=>all().filter(t=>t.parentId===id);
function dueInfo(t){
  if(!t.due) return null;
  const td=T(), dd=diffDays(t.due,td); let txt,cls;
  if(dd<0){ cls='due-over'; txt=dd===-1?'昨日':fmtMD(t.due); }
  else if(dd===0){ cls='due-today'; txt='今日'; }
  else if(dd===1){ cls='due-tom'; txt='明日'; }
  else if(dd<7){ cls='due-week'; txt=WD[pYmd(t.due).getDay()]+'曜日'; }
  else { cls='due-later'; txt=fmtMD(t.due); }
  return {txt:txt+(t.time?' '+t.time:''),cls};
}
const dueKey=t=>t.due?t.due+' '+(t.time||'99:99'):'9999';
const SORTS={
  manual:(a,b)=>(a.order??0)-(b.order??0)||a.createdAt-b.createdAt,
  due:(a,b)=>dueKey(a).localeCompare(dueKey(b))||a.priority-b.priority,
  priority:(a,b)=>a.priority-b.priority||dueKey(a).localeCompare(dueKey(b)),
  name:(a,b)=>a.title.localeCompare(b.title,'ja'),
  created:(a,b)=>b.createdAt-a.createdAt,
  smart:(a,b)=>(a.time?0:1)-(b.time?0:1)||(a.time||'').localeCompare(b.time||'')||a.priority-b.priority||(a.order??0)-(b.order??0),
};
const SORT_NAMES={smart:'おすすめ（時刻→優先度）',manual:'手動（並べた順）',due:'期限',priority:'優先度',name:'名前',created:'追加日（新しい順）'};
const sortT=(arr,mode)=>arr.slice().sort(SORTS[mode]||SORTS.manual);
function maxOrder(){ let m=0; for(const t of S.tasks.values()) if((t.order??0)>m) m=t.order; return m; }
function makeTask(o){
  return {id:newId(),title:o.title||'',desc:o.desc||'',projectId:o.projectId||'inbox',sectionId:o.sectionId||'',parentId:o.parentId||'',
    due:o.due||'',time:o.time||'',recur:o.recur||null,priority:o.priority||4,labels:o.labels||[],done:false,doneAt:0,
    createdAt:Date.now(),updatedAt:Date.now(),order:maxOrder()+1};
}
function ensureLabel(name){
  let l=S.meta.labels.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!l){ l={id:newId(),name,color:'gray'}; S.meta.labels.push(l); Persist.putMeta(); }
  return l.id;
}
function ensureProject(name){
  let p=S.meta.projects.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){ p={id:newId(),name,color:'blue',sections:[]}; S.meta.projects.push(p); Persist.putMeta(); }
  return p.id;
}
function completeTask(id){
  const t=S.tasks.get(id); if(!t) return;
  if(t.recur&&!t.done){
    const before=clone(t);
    let nx=nextOcc(t.recur,t.due||T()); let g=0; while(nx<=T()&&g++<1000) nx=nextOcc(t.recur,nx);
    t.due=nx; Persist.putTask(t); Persist.log('complete',t,'繰り返し');
    toast(`完了しました。次回は${fmtMD(nx)}`,()=>{ Object.assign(t,before); Persist.putTask(t); Persist.log('uncomplete',t); render(); });
    render(); return;
  }
  const affected=[t,...descendants(id).filter(c=>!c.done)];
  const snaps=affected.map(clone);
  affected.forEach(x=>{ x.done=true; x.doneAt=Date.now(); Persist.putTask(x); });
  Persist.log('complete',t);
  toast('完了しました',()=>{ snaps.forEach(s=>{ const x=S.tasks.get(s.id); if(x){ Object.assign(x,s); Persist.putTask(x);} }); Persist.log('uncomplete',t); render(); });
  render();
}
function uncompleteTask(id){ const t=S.tasks.get(id); if(!t) return; t.done=false; t.doneAt=0; Persist.putTask(t); Persist.log('uncomplete',t); render(); }
function descendants(id){ const out=[]; const walk=p=>childrenOf(p).forEach(c=>{out.push(c);walk(c.id);}); walk(id); return out; }
function deleteTask(id){
  const t=S.tasks.get(id); if(!t) return;
  const ds=descendants(id);
  [t,...ds].forEach(x=>Persist.delTask(x.id));
  Persist.log('delete',t, ds.length?`サブタスク${ds.length}件も削除`:'');
}

function taskRow(t,o={}){

  if(di&&!o.noDate) meta.push(`<span class="${di.cls}">${I('cal','sm')}${esc(o.timeOnly?(t.time||''):di.txt)}</span>`);
  if(di&&o.noDate&&o.timeOnly&&t.time) meta.push(`<span class="${di.cls}">${I('clock','sm')}${t.time}</span>`);
  if(t.recur) meta.push(`<span>${I('repeat','sm')}${esc(recurLabel(t.recur))}</span>`);
  if(kids.length) meta.push(`<span>${I('sub','sm')}${kd}/${kids.length}</span>`);
  (t.labels||[]).forEach(id=>{const l=label(id); if(l) meta.push(`<span class="lbl">${I('tag','sm')}${esc(l.name)}</span>`);});
  if(o.parent){ const pt=S.tasks.get(t.parentId); if(pt) meta.push(`<span>↳ ${esc(pt.title)}</span>`); }
  if(o.showProject&&pr) meta.push(`<span class="tproj">${esc(pr.name)}${sec?' / '+esc(sec.name):''}<i class="cdot" style="background:${COLORS[pr.color]}"></i></span>`);
  const cls=`${o.card?'bcard':'task'} pr${t.priority} ${t.done?'done':''} ${o.depth?'depth'+Math.min(o.depth,2):''}`;
  return `<div class="${cls}" data-task="${t.id}" ${o.card&&FINE?'draggable="true"':''}>
    <button class="check" data-check="${t.id}" aria-label="${t.done?'未完了に戻す':'完了にする'}">${I('check')}</button>
    <div class="tbody"><div class="ttitle">${esc(t.title)||'<span style="color:var(--muted)">（無題）</span>'}</div>
    ${t.desc?`<div class="tdesc">${esc(t.desc.split('\n')[0])}</div>`:''}

}
function addRow(preset,text='タスクを追加'){ return `<button class="addrow" data-add='${esc(JSON.stringify(preset))}'>${I('plus')}${text}</button>`; }
function emptyState(h,title,body){
  h.push(`<div class="empty">${I('done')}<h3>${esc(title)}</h3><p>${esc(body)}</p></div>`);
}
function treeRows(h,list,o={}){
  const ids=new Set(list.map(t=>t.id)), sort=o.sort||'manual';
  const roots=sortT(list.filter(t=>!t.parentId||!ids.has(t.parentId)),sort);
  const walk=(t,d)=>{ h.push(taskRow(t,{...o,depth:d})); sortT(list.filter(c=>c.parentId===t.id),'manual').forEach(c=>walk(c,d+1)); };
  roots.forEach(t=>walk(t,0));
}

  <b>ボード</b>：カードを長押しして動かすと、セクション（またはフィルター等では優先度）と並び順を変えられます。</div>`);
  h.push(`<p class="mode-note">バージョン ${APP_VER}</p>`);
  h.push(`<p class="mode-note">${Store.mode==='db'?'保存先：あなた専用の保存領域（claude.ai）。ほかの人からは見えません。':'保存先：この端末のブラウザ内。'}<br>業務の機密情報や個人情報は入力しないでください。</p>`);
}

/* ========= sheets ========= */
let sheetClose=null;
function openSheet(html,onClose){
  const layer=$('#layer'); $('#sheet').innerHTML=html; layer.hidden=false; sheetClose=onClose||null; fitKb();
  return $('#sheet');
}
function closeSheet(){ const f=sheetClose; sheetClose=null; $('#layer').hidden=true; $('#sheet').innerHTML=''; if(f) f(); }
$('#layer .scrim').addEventListener('click',closeSheet);
function fitKb(){ const vv=window.visualViewport; if(!vv) return; const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop); document.documentElement.style.setProperty('--kb',kb+'px'); }
if(window.visualViewport){ visualViewport.addEventListener('resize',fitKb); visualViewport.addEventListener('scroll',fitKb); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#layer').hidden) closeSheet(); });

function confirmSheet(msg,ok='実行',danger=true){
  return new Promise(res=>{
    const sh=openSheet(`<h2>${esc(msg)}</h2><div class="row2"><button class="btn" data-r="0">キャンセル</button><button class="btn ${danger?'danger':'pri'}" data-r="1">${esc(ok)}</button></div>`,()=>res(false));
    sh.addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b) return; sheetClose=null; closeSheet(); res(b.dataset.r==='1'); });
  });
}
function optionsSheet(title,opts){
  const sh=openSheet(`<h2>${esc(title)}</h2><div>${opts.map((o,i)=>`<button class="opt ${o.danger?'danger':''}" data-i="${i}" ${o.checked!=null?`role="menuitemradio" aria-checked="${o.checked}"`:''}>${o.icon?I(o.icon):''}${esc(o.label)}${o.value?`<span class="ov">${esc(o.value)}</span>`:''}</button>`).join('')}</div>`);
  sh.addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(!b) return; const o=opts[+b.dataset.i]; closeSheet(); o.run(); });
}
function colorPicker(cur){ return `<div class="colors" id="colors">${Object.entries(COLORS).map(([k,c])=>`<button type="button" data-color="${k}" aria-pressed="${k===cur}" aria-label="${k}" style="background:${c}"></button>`).join('')}</div>`; }
function bindColors(sh,on){ sh.querySelector('#colors').addEventListener('click',e=>{ const b=e.target.closest('[data-color]'); if(!b) return; $$('#colors button',sh).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); on(b.dataset.color); }); }

function nameSheet({title,value='',placeholder='',color,ok='保存',extra='',validate}){
  return new Promise(res=>{
    let col=color;
    const sh=openSheet(`<h2>${esc(title)}</h2><form id="nf" class="field" style="gap:12px"><input class="inp" id="nfName" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" enterkeyhint="done">${extra}${color!==undefined?colorPicker(color):''}<div class="err" id="nfErr"></div><div class="row2"><button type="button" class="btn" data-r="0">キャンセル</button><button class="btn pri" type="submit">${esc(ok)}</button></div></form>`,()=>res(null));
    if(color!==undefined) bindColors(sh,c=>col=c);
    const inp=$('#nfName',sh); inp.focus();
    sh.querySelector('[data-r="0"]').onclick=()=>closeSheet();
    $('#nf',sh).addEventListener('submit',e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v){ $('#nfErr',sh).textContent='名前を入力してください'; return; }
      const err=validate&&validate(v,sh); if(err){ $('#nfErr',sh).textContent=err; return; }
      sheetClose=null; const q=$('#nfQuery',sh); closeSheet(); res({name:v,color:col,query:q?q.value.trim():undefined}); });
  });
}

/* quick add */
function openQuickAdd(preset={}){
  const ps=S.meta.projects;
  const pid0=preset.projectId||(V.type==='project'?V.id:'inbox');
  const projOpts=ps.map(p=>`<option value="${p.id}::" ${p.id===pid0&&!preset.sectionId?'selected':''}>${esc(p.name)}</option>`+p.sections.map(s=>`<option value="${p.id}::${s.id}" ${p.id===pid0&&s.id===preset.sectionId?'selected':''}>　${esc(p.name)} / ${esc(s.name)}</option>`).join('')).join('');
  const sh=openSheet(`<form id="qa" style="display:flex;flex-direction:column;gap:8px">
    <input class="qa-input" id="qaText" placeholder="例：資料確認 明日 15時 p1 #仕事 @待ち" autocomplete="off" enterkeyhint="send">
    <input class="qa-desc" id="qaDesc" placeholder="メモ" autocomplete="off">
    <div class="pchips" id="qaChips"></div>
    <div class="qa-bar">
      <input type="date" id="qaDate" value="${preset.due||''}" aria-label="期限">
      <select id="qaPrio" aria-label="優先度">${[1,2,3,4].map(n=>`<option value="${n}" ${(preset.priority||4)===n?'selected':''}>優先度${n}</option>`).join('')}</select>
      <select id="qaProj" aria-label="プロジェクト">${projOpts}</select>
      <span class="grow"></span>
      <button class="btn pri" type="submit" id="qaGo" disabled>追加</button>
    </div>
    ${preset.parentId?`<p class="hint">「${esc(S.tasks.get(preset.parentId)?.title||'')}」のサブタスクとして追加します</p>`:''}
  </form>`);
  const txt=$('#qaText',sh); txt.focus();
  const chips=()=>{
    const r=parseQuick(txt.value), c=[];
    if(r.due) c.push(`<span class="pchip">${I('cal','sm')}${fmtMD(r.due)}${r.time?' '+r.time:''}</span>`); else if(r.time) c.push(`<span class="pchip">${I('clock','sm')}${r.time}</span>`);
    if(r.recur) c.push(`<span class="pchip">${I('repeat','sm')}${recurLabel(r.recur)}</span>`);
    if(r.priority) c.push(`<span class="pchip">${I('flag','sm')}優先度${r.priority}</span>`);
    if(r.projectName){ const ex=S.meta.projects.some(p=>p.name.toLowerCase()===r.projectName.toLowerCase()); c.push(`<span class="pchip ${ex?'':'warn'}">${I('hash','sm')}${esc(r.projectName)}${ex?'':'（新規）'}</span>`); }
    r.labelNames.forEach(n=>{ const ex=S.meta.labels.some(l=>l.name.toLowerCase()===n.toLowerCase()); c.push(`<span class="pchip ${ex?'':'warn'}">${I('tag','sm')}${esc(n)}${ex?'':'（新規）'}</span>`); });
    $('#qaChips',sh).innerHTML=c.join('');
    $('#qaGo',sh).disabled=!r.title;
  };
  txt.addEventListener('input',chips);
  $('#qa',sh).addEventListener('submit',e=>{
    e.preventDefault();
    const r=parseQuick(txt.value); if(!r.title) return;
    const [pp,ss]=$('#qaProj',sh).value.split('::');
    const parent=preset.parentId?S.tasks.get(preset.parentId):null;
    const labels=[...(preset.labels||[])]; r.labelNames.forEach(n=>{ const id=ensureLabel(n); if(!labels.includes(id)) labels.push(id); });
    const t=makeTask({title:r.title,desc:$('#qaDesc',sh).value.trim(),
      projectId:r.projectName?ensureProject(r.projectName):(parent?parent.projectId:pp),
      sectionId:r.projectName?'':(parent?parent.sectionId:ss),parentId:preset.parentId||'',
      due:r.due||$('#qaDate',sh).value||'',time:r.time||'',recur:r.recur||null,
      priority:r.priority||+$('#qaPrio',sh).value,labels});
    Persist.putTask(t); Persist.log('add',t); Sound.play('add');
    txt.value=''; $('#qaDesc',sh).value=''; chips(); txt.focus();
    const pr=proj(t.projectId);
    toast(`「${t.title}」を${pr?pr.name:''}に追加しました`);
    render();
    if(preset.parentId){ closeSheet(); openTask(preset.parentId); }
  });
  chips();
}

/* task detail */
function openTask(id){
  const t=S.tasks.get(id); if(!t) return;
  const ps=S.meta.projects;
  const projOpts=ps.map(p=>`<option value="${p.id}::" ${p.id===t.projectId&&!t.sectionId?'selected':''}>${esc(p.name)}</option>`+p.sections.map(s=>`<option value="${p.id}::${s.id}" ${p.id===t.projectId&&s.id===t.sectionId?'selected':''}>　${esc(p.name)} / ${esc(s.name)}</option>`).join('')).join('');
  const kids=sortT(childrenOf(id),'manual');
  const parent=t.parentId?S.tasks.get(t.parentId):null;
  const hist=[]; for(const a of S.activity.values()) for(const e of a) if(e.id===id) hist.push(e);
  hist.sort((a,b)=>b.t-a.t);
  const verb={add:'追加',complete:'完了',uncomplete:'未完了に戻す',update:'変更',delete:'削除',resched:'日付変更'};
  const sh=openSheet(`
    ${parent?`<button class="hint" data-open="${parent.id}" style="text-align:left">↰ ${esc(parent.title)}</button>`:''}
    <div class="detail-title pr${t.priority} ${t.done?'done':''}"><button class="check ${t.done?'on':''}" id="dCheck" aria-label="${t.done?'未完了に戻す':'完了にする'}">${I('check')}</button><textarea id="dTitle" rows="1" aria-label="タスク名">${esc(t.title)}</textarea></div>
    <textarea class="inp" id="dDesc" rows="2" placeholder="メモ（根拠資料の場所、相手先など）">${esc(t.desc||'')}</textarea>
    <div class="field"><span class="flabel">${I('cal','sm')}期限</span>
      <div class="row2"><input class="inp" type="date" id="dDate" value="${t.due||''}"><input class="inp" type="time" id="dTime" value="${t.time||''}"></div>
      <div class="quick"><button class="btn sm" data-q="0">今日</button><button class="btn sm" data-q="1">明日</button><button class="btn sm" data-q="w">来週月曜</button><button class="btn sm" data-q="">日付なし</button></div></div>
    <div class="field"><label for="dRecur">${I('repeat','sm')}繰り返し</label><input class="inp" id="dRecur" list="recurList" placeholder="例：毎週月曜、毎月末、平日" value="${esc(recurLabel(t.recur))}" autocomplete="off"><datalist id="recurList"><option value="毎日"><option value="平日"><option value="毎週月曜"><option value="毎週金曜"><option value="隔週"><option value="毎月1日"><option value="毎月末"><option value="毎年"></datalist><span class="hint" id="dRecurMsg"></span></div>
    <div class="field"><span class="flabel">${I('flag','sm')}優先度</span><div class="prio" id="dPrio">${[1,2,3,4].map(n=>`<button class="f${n}" data-p="${n}" aria-pressed="${t.priority===n}">${I('flag','sm')}P${n}</button>`).join('')}</div></div>
    <div class="field"><label for="dProj">${I('hash','sm')}プロジェクト</label><select class="inp" id="dProj" ${parent?'disabled':''}>${projOpts}</select></div>
    <div class="field"><span class="flabel">${I('tag','sm')}ラベル</span><div class="lchips" id="dLabels">${S.meta.labels.map(l=>`<button class="chip" data-l="${l.id}" aria-pressed="${(t.labels||[]).includes(l.id)}">${esc(l.name)}</button>`).join('')}<button class="chip" data-act="newLabelInline">＋新規</button></div></div>
    <div class="field subs"><span class="flabel">${I('sub','sm')}サブタスク ${kids.length?`${kids.filter(k=>k.done).length}/${kids.length}`:''}</span><div>${kids.map(k=>taskRow(k,{kids:childrenOf(k.id)})).join('')}</div><button class="addrow" data-subadd="${id}">${I('plus')}サブタスクを追加</button></div>
    ${hist.length?`<div class="field"><span class="flabel">${I('activity','sm')}このタスクの履歴</span>${hist.slice(0,8).map(e=>`<div class="hint">${fmtMD(ymd(new Date(e.t)))} ${fmtTime(e.t)}　${verb[e.type]||e.type}${e.d?'（'+esc(e.d)+'）':''}</div>`).join('')}</div>`:''}
    <div class="foot"><button class="btn sm" id="dDup">${I('copy','sm')}複製</button><button class="btn sm danger" id="dDel">${I('trash','sm')}削除</button><span class="grow" style="flex:1"></span><button class="btn sm pri" id="dClose">閉じる</button>
    <div class="meta">追加 ${new Date(t.createdAt).toLocaleString('ja-JP')}・更新 ${new Date(t.updatedAt).toLocaleString('ja-JP')}</div></div>`,()=>{ flush(); render(); });
  const ti=$('#dTitle',sh); const auto=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px';}; auto(ti);
  let dirty={}; const changed=k=>dirty[k]=true;
  const flush=()=>{
    if(!S.tasks.has(id)) return; const cur=t;
    const keys=Object.keys(dirty); if(!keys.length) return;
    const nm={title:'名前',desc:'メモ',due:'期限',recur:'繰り返し',priority:'優先度',project:'プロジェクト',labels:'ラベル'};
    Persist.putTask(cur); Persist.log(keys.includes('due')&&keys.length===1?'resched':'update',cur,keys.map(k=>nm[k]).join('・')+(keys.includes('due')?`→${cur.due?fmtMD(cur.due):'なし'}`:'')); dirty={};
  };
  ti.addEventListener('input',()=>{ auto(ti); t.title=ti.value.replace(/\n/g,' '); changed('title'); });
  $('#dDesc',sh).addEventListener('input',e=>{ t.desc=e.target.value; changed('desc'); });
  $('#dDate',sh).addEventListener('change',e=>{ t.due=e.target.value; if(!t.due) t.time=''; changed('due'); flush(); });
  $('#dTime',sh).addEventListener('change',e=>{ t.time=e.target.value; if(t.time&&!t.due){ t.due=T(); $('#dDate',sh).value=t.due; } changed('due'); flush(); });
  $$('[data-q]',sh).forEach(b=>b.onclick=()=>{ const q=b.dataset.q; t.due=q===''?'':q==='w'?addDays(mondayOf(T()),7):addDays(T(),+q); if(!t.due) t.time=''; $('#dDate',sh).value=t.due; $('#dTime',sh).value=t.time; changed('due'); flush(); });
  const rI=$('#dRecur',sh), rM=$('#dRecurMsg',sh);
  rI.addEventListener('change',()=>{
    const v=rI.value.trim();
    if(!v){ t.recur=null; rM.textContent=''; changed('recur'); flush(); return; }
    const r=parseRecur(v);
    if(!r){ rM.textContent='読み取れませんでした。例：毎週月曜、毎月10日、平日'; return; }
    if(r.r.freq==='week'&&!r.r.days.length) r.r.days=[pYmd(t.due||T()).getDay()];
    if(r.r.freq==='month'&&!r.r.dom) r.r.dom=pYmd(t.due||T()).getDate();
    t.recur=r.r; if(!t.due){ t.due=firstOcc(r.r,T()); $('#dDate',sh).value=t.due; }
    rI.value=recurLabel(t.recur); rM.textContent=`次の期限：${fmtMD(t.due)}`; changed('recur'); flush();
  });
  $('#dPrio',sh).addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(!b) return; t.priority=+b.dataset.p; $$('#dPrio button',sh).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); const dt=$('.detail-title',sh); dt.className=`detail-title pr${t.priority} ${t.done?'done':''}`; changed('priority'); flush(); });
  $('#dProj',sh).addEventListener('change',e=>{ const [p,s]=e.target.value.split('::'); t.projectId=p; t.sectionId=s||''; descendants(id).forEach(c=>{c.projectId=p;c.sectionId=t.sectionId;Persist.putTask(c);}); changed('project'); flush(); });
  $('#dLabels',sh).addEventListener('click',async e=>{
    const b=e.target.closest('[data-l]');
    if(b){ const l=b.dataset.l; t.labels=t.labels||[]; const on=t.labels.includes(l); t.labels=on?t.labels.filter(x=>x!==l):[...t.labels,l]; b.setAttribute('aria-pressed',String(!on)); changed('labels'); flush(); return; }
    if(e.target.closest('[data-act="newLabelInline"]')){ flush(); const r=await nameSheet({title:'ラベルを追加',placeholder:'例：決裁待ち',color:'gray',validate:v=>S.meta.labels.some(l=>l.name===v)?'同じ名前のラベルがあります':''}); if(r){ const l={id:newId(),name:r.name.replace(/^@/,''),color:r.color}; S.meta.labels.push(l); Persist.putMeta(); const cur=S.tasks.get(id); if(cur){ cur.labels=[...(cur.labels||[]),l.id]; Persist.putTask(cur); } } openTask(id); }
  });
  $('#dCheck',sh).onclick=()=>{ if(!t.done) Sound.play('done'); flush(); sheetClose=null; closeSheet(); t.done?uncompleteTask(id):completeTask(id); };
  $('#dClose',sh).onclick=()=>closeSheet();
  $('#dDup',sh).onclick=()=>{ flush(); const c=makeTask({...clone(t),title:t.title+'（コピー）'}); Persist.putTask(c); Persist.log('add',c,'複製'); sheetClose=null; closeSheet(); render(); openTask(c.id); };
  $('#dDel',sh).onclick=async()=>{ flush(); sheetClose=null; const n=descendants(id).length; if(await confirmSheet(`「${t.title}」を削除しますか？${n?`（サブタスク${n}件も削除）`:''}`,'削除')){ deleteTask(id); toast('削除しました'); render(); } else openTask(id); };
  sh.addEventListener('click',e=>{
    const sa=e.target.closest('[data-subadd]'); if(sa){ flush(); sheetClose=null; closeSheet(); openQuickAdd({parentId:id}); return; }
    const ck=e.target.closest('[data-check]'); if(ck&&ck.closest('.subs')){ flush(); const k=S.tasks.get(ck.dataset.check); if(k){ if(k.done){ k.done=false;k.doneAt=0;Persist.putTask(k);Persist.log('uncomplete',k);} else { Sound.play('done'); k.done=true;k.doneAt=Date.now();Persist.putTask(k);Persist.log('complete',k);} } sheetClose=null; openTask(id); return; }
    const op=e.target.closest('[data-open]')||(e.target.closest('.subs [data-task]')); if(op){ flush(); sheetClose=null; openTask(op.dataset.open||op.dataset.task); }
  });
}

/* view menu */
function viewMenu(){
  const p=pref(), opts=[];
  const sorts=V.type==='upcoming'||V.type==='today'?['smart','priority','name','created']:['manual','due','priority','name','created'];
  opts.push({label:'並び替え',value:SORT_NAMES[p.sort]||'',icon:'list',run:()=>optionsSheet('並び替え',sorts.map(s=>({label:SORT_NAMES[s],checked:p.sort===s,run:()=>setPref({sort:s})})))});
  if(V.type==='inbox'||V.type==='project') opts.push({label:p.showDone?'完了済みを隠す':'完了済みも表示する',icon:'done',run:()=>setPref({showDone:!p.showDone})});
  if(V.type==='inbox'||V.type==='project') opts.push({label:'セクションを追加',icon:'board',run:addSection});
  if(V.type==='project'){
    const pr=proj(V.id);
    opts.push({label:'プロジェクトを編集',icon:'edit',run:async()=>{ const r=await nameSheet({title:'プロジェクトを編集',value:pr.name,color:pr.color}); if(r){ pr.name=r.name; pr.color=r.color; Persist.putMeta(); render(); } }});
    opts.push({label:'プロジェクトを削除',icon:'trash',danger:true,run:async()=>{ const n=all().filter(t=>t.projectId===pr.id).length; if(await confirmSheet(`「${pr.name}」を削除しますか？${n?`タスク${n}件も削除されます。`:''}`,'削除')){ all().filter(t=>t.projectId===pr.id).forEach(t=>Persist.delTask(t.id)); S.meta.projects=S.meta.projects.filter(x=>x.id!==pr.id); Persist.putMeta(); goTab('browse'); toast('削除しました'); } }});
  }
  if(V.type==='filter'){
    opts.push({label:'フィルターを編集',icon:'edit',run:editFilter});
    opts.push({label:'フィルターを削除',icon:'trash',danger:true,run:async()=>{ const f=filt(V.id); if(await confirmSheet(`フィルター「${f.name}」を削除しますか？（タスクは消えません）`,'削除')){ S.meta.filters=S.meta.filters.filter(x=>x.id!==f.id); Persist.putMeta(); goTab('browse'); } }});
  }
  if(V.type==='label'){
    const l=label(V.id);
    opts.push({label:'ラベルを編集',icon:'edit',run:async()=>{ const r=await nameSheet({title:'ラベルを編集',value:l.name,color:l.color,validate:v=>S.meta.labels.some(x=>x.name===v&&x.id!==l.id)?'同じ名前のラベルがあります':''}); if(r){ l.name=r.name.replace(/^@/,''); l.color=r.color; Persist.putMeta(); render(); } }});
    opts.push({label:'ラベルを削除',icon:'trash',danger:true,run:async()=>{ if(await confirmSheet(`ラベル「${l.name}」を削除しますか？（タスクは消えません）`,'削除')){ all().filter(t=>(t.labels||[]).includes(l.id)).forEach(t=>{t.labels=t.labels.filter(x=>x!==l.id);Persist.putTask(t);}); S.meta.labels=S.meta.labels.filter(x=>x.id!==l.id); Persist.putMeta(); goTab('browse'); } }});
  }
  optionsSheet('表示メニュー',opts);
}
function filterSheet(f){
  const extra=`<label class="flabel" for="nfQuery">条件</label><input class="inp" id="nfQuery" value="${esc(f?f.query:'')}" placeholder="例：(期限切れ | 今日) &amp; #仕事" autocomplete="off" autocapitalize="off"><div class="help">使える条件：<code>今日</code> <code>期限切れ</code> <code>今週</code> <code>7日以内</code> <code>期限なし</code> <code>p1</code> <code>@ラベル</code> <code>#プロジェクト</code> <code>繰り返し</code> <code>検索:語句</code><br>組み合わせ：<code>&amp;</code> かつ／<code>|</code> または／<code>!</code> でない</div>`;
  return nameSheet({title:f?'フィルターを編集':'フィルターを追加',value:f?f.name:'',placeholder:'例：今週の仕事',color:f?f.color:'blue',extra,
    validate:(v,sh)=>{ try{ compileFilter($('#nfQuery',sh).value); return ''; }catch(e){ return e.message; } }});

async function editFilter(){ const f=filt(V.id); const r=await filterSheet(f); if(r){ f.name=r.name; f.color=r.color; f.query=r.query; Persist.putMeta(); render(); } }
async function addSection(){

}
function sectionMenu(sid){
  const pid=V.type==='inbox'?'inbox':V.id, pr=proj(pid), s=pr&&pr.sections.find(x=>x.id===sid); if(!s) return;
  const i=pr.sections.indexOf(s);
  optionsSheet(s.name,[
    {label:'名前を変更',icon:'edit',run:async()=>{ const r=await nameSheet({title:'セクション名',value:s.name}); if(r){ s.name=r.name; Persist.putMeta(); render(); } }},
    ...(i>0?[{label:'左（上）へ移動',icon:'up',run:()=>{ pr.sections.splice(i,1); pr.sections.splice(i-1,0,s); Persist.putMeta(); render(); }}]:[]),
    ...(i<pr.sections.length-1?[{label:'右（下）へ移動',icon:'down',run:()=>{ pr.sections.splice(i,1); pr.sections.splice(i+1,0,s); Persist.putMeta(); render(); }}]:[]),
    {label:'セクションを削除',icon:'trash',danger:true,run:async()=>{ if(await confirmSheet(`セクション「${s.name}」を削除しますか？（タスクは「セクションなし」に移ります）`,'削除')){ all().filter(t=>t.projectId===pid&&t.sectionId===sid).forEach(t=>{t.sectionId='';Persist.putTask(t);}); pr.sections=pr.sections.filter(x=>x.id!==sid); Persist.putMeta(); render(); } }},
  ]);
}

/* backup */
async function doExport(){
  const data=JSON.stringify({app:'yarukoto',v:1,exportedAt:new Date().toISOString(),meta:S.meta,tasks:all(),activity:Object.fromEntries(S.activity)},null,1);
  const name=`yarukoto-${T()}.json`;
  if(window.claude&&typeof window.claude.use==='function'){
    const dl=await window.claude.use('downloads').catch(()=>null);
    if(dl){ try{ const r=await dl.save({filename:name,data}); if(r&&r.status==='saved') toast('書き出しました'); return; }catch(e){ if(e&&e.code==='declined') return; } }
  } else {
    try{ const f=new File([data],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); toast('書き出しました'); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('書き出しました'); return; }catch(e){}
  }
  const sh=openSheet(`<h2>データを書き出す</h2><p class="hint">ファイルとして保存できなかったため、内容を表示しています。全文をコピーしてメモ等に保存してください。</p><textarea class="inp" id="exTxt" rows="8" readonly>${esc(data)}</textarea><div class="row2"><button class="btn" data-r="close">閉じる</button><button class="btn pri" data-r="copy">コピー</button></div>`);
  sh.addEventListener('click',async e=>{ const b=e.target.closest('[data-r]'); if(!b) return; if(b.dataset.r==='close') return closeSheet(); const ta=$('#exTxt',sh); try{ await navigator.clipboard.writeText(data); toast('コピーしました'); }catch(_){ ta.focus(); ta.select(); toast('選択しました。コピーしてください'); } });
}
function doImport(){
  const sh=openSheet(`<h2>データを読み込む</h2><p class="hint">書き出したJSONファイルを選ぶか、内容を貼り付けてください。今のデータはすべて置き換わります。</p><input type="file" id="imFile" accept=".json,application/json" class="inp"><textarea class="inp" id="imTxt" rows="5" placeholder="ここに貼り付け"></textarea><div class="err" id="imErr"></div><div class="row2"><button class="btn" data-r="close">キャンセル</button><button class="btn pri" data-r="go">読み込む</button></div>`);
  $('#imFile',sh).addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ $('#imTxt',sh).value=fr.result; }; fr.readAsText(f); });
  sh.addEventListener('click',async e=>{
    const b=e.target.closest('[data-r]'); if(!b) return; if(b.dataset.r==='close') return closeSheet();
    let d; try{ d=JSON.parse($('#imTxt',sh).value); if(d.app!=='yarukoto'||!d.meta||!Array.isArray(d.tasks)) throw 0; }catch(_){ $('#imErr',sh).textContent='やること帳から書き出したデータではないようです'; return; }
    closeSheet();
    if(!await confirmSheet(`タスク${d.tasks.length}件を読み込み、今のデータを置き換えますか？`,'置き換える')) return;
    const keep=new Set(d.tasks.map(t=>t.id));
    all().forEach(t=>{ if(!keep.has(t.id)) Persist.delTask(t.id); });
    S.meta=normalizeMeta(d.meta); Persist.putMeta();
    d.tasks.forEach(t=>Persist.putTask(t));
    Object.entries(d.activity||{}).forEach(([k,v])=>{ S.activity.set(k,v); if(Store.mode==='db'){ pendingAct.set(k,v); enqueue(Store.refs.act.doc(k),'set',{events:v},()=>pendingAct.delete(k)); } });
    if(Store.mode!=='db') lsSaveSoon();
    toast(`${d.tasks.length}件を読み込みました`); goTab('today');
  });
}

/* ========= events ========= */
let toastT=0;
function toast(msg,undo,actLabel='元に戻す',ms){
  const el=$('#toast'); el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button id="undoBtn">${esc(actLabel)}</button>`:''}`; el.hidden=false;
  if(undo) $('#undoBtn').onclick=()=>{ el.hidden=true; undo(); };
  clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,ms||(undo?5000:2600));
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) goTab(b.dataset.tab); });
$('#backBtn').addEventListener('click',back);
$('#menuBtn').addEventListener('click',viewMenu);
$('#fab').addEventListener('click',()=>{
  const pre={};
  if(V.type==='today') pre.due=T();
  if(V.type==='project') pre.projectId=V.id;
  if(V.type==='label') pre.labels=[V.id];
  openQuickAdd(pre);
});
$('#layoutSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-layout]'); if(b) setPref({layout:b.dataset.layout}); });
$('#main').addEventListener('input',e=>{ if(e.target.id==='searchInp'){ searchQ=e.target.value; $('#searchRes').innerHTML=searchResults(); } });
$('#main').addEventListener('click',async e=>{
  if(suppressClick) return;
  const t=e.target;
  const ck=t.closest('[data-check]');
  if(ck){ const id=ck.dataset.check, task=S.tasks.get(id); if(!task) return;
    if(task.done) return uncompleteTask(id);
    Sound.play('done');
    const row=ck.closest('[data-task]'); ck.classList.add('on'); row&&row.classList.add('leaving'); setTimeout(()=>completeTask(id),220); return; }
  const add=t.closest('[data-add]'); if(add){ openQuickAdd(JSON.parse(add.dataset.add)); return; }
  const g=t.closest('[data-go]'); if(g){ const v=JSON.parse(g.dataset.go); if(v.type==='inbox') goTab('inbox'); else go(v); return; }
  const sm=t.closest('[data-secmenu]'); if(sm){ sectionMenu(sm.dataset.secmenu); return; }
  const j=t.closest('[data-jump]'); if(j){ const el=document.getElementById('d-'+j.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const cn=t.closest('[data-cal]'); if(cn){ const k=vkey(V), td=T(); if(cn.dataset.cal==='today'){ calCursor[k]=td.slice(0,7); calSel[k]=td; } else { const [y,m]=(calCursor[k]||td.slice(0,7)).split('-').map(Number); const d=new Date(y,m-1+ +cn.dataset.cal,1); calCursor[k]=ymd(d).slice(0,7); } render(); return; }
  const cd=t.closest('[data-day]'); if(cd){ calSel[vkey(V)]=cd.dataset.day; render(); return; }
  const af=t.closest('[data-actf]'); if(af){ actFilter=af.dataset.actf; render(); return; }
  const a=t.closest('[data-act]');
  if(a){ switch(a.dataset.act){
    case 'sample': return addSamples();
    case 'dismissWelcome': S.meta.welcomeDone=true; Persist.putMeta(); return render();
    case 'reschedOver': { const td=T(); const ov=activeTasks().filter(x=>x.due&&x.due<td); if(!await confirmSheet(`期限切れの${ov.length}件を今日に変更しますか？`,'今日に変更',false)) return; ov.forEach(x=>{x.due=td;Persist.putTask(x);Persist.log('resched',x,'期限切れ→今日');}); toast(`${ov.length}件を今日に変更しました`); return render(); }
    case 'addSection': return addSection();
    case 'newProject': { const r=await nameSheet({title:'プロジェクトを追加',placeholder:'例：指令システム更新',color:'teal',validate:v=>S.meta.projects.some(p=>p.name===v)?'同じ名前のプロジェクトがあります':''}); if(r){ const p={id:newId(),name:r.name,color:r.color,sections:[]}; S.meta.projects.push(p); Persist.putMeta(); go({type:'project',id:p.id}); } return; }
    case 'newLabel': { const r=await nameSheet({title:'ラベルを追加',placeholder:'例：決裁待ち',color:'gray',validate:v=>S.meta.labels.some(l=>l.name===v)?'同じ名前のラベルがあります':''}); if(r){ S.meta.labels.push({id:newId(),name:r.name.replace(/^@/,''),color:r.color}); Persist.putMeta(); render(); } return; }
    case 'newFilter': { const r=await filterSheet(null); if(r){ const f={id:newId(),name:r.name,color:r.color,query:r.query}; S.meta.filters.push(f); Persist.putMeta(); go({type:'filter',id:f.id}); } return; }
    case 'editFilter': return editFilter();
    case 'setGoal': { const r=await nameSheet({title:'1日の完了目標（件数）',value:String(S.meta.goal),validate:v=>/^\d{1,3}$/.test(v)&&+v>0?'':'1以上の数字を入力してください'}); if(r){ S.meta.goal=+r.name; Persist.putMeta(); render(); } return; }
    case 'toggleSound': S.meta.sound=S.meta.sound===false; Persist.putMeta(); render(); if(S.meta.sound) Sound.play('done'); return;
    case 'export': return doExport();
    case 'import': return doImport();
    case 'purgeDone': { const lim=Date.now()-30*864e5; const old=all().filter(x=>x.done&&(x.doneAt||0)<lim); if(!old.length) return toast('30日より前の完了済みタスクはありません'); if(await confirmSheet(`完了済みタスク${old.length}件を削除しますか？（履歴は残ります）`,'削除')){ old.forEach(x=>Persist.delTask(x.id)); render(); } return; }
  } return; }
  const row=t.closest('[data-task]'); if(row){ openTask(row.dataset.task); }
});
function addSamples(){
  const lines=['（例）承諾協議の論点を整理する 明日 10時 p1 #仕事 @起案','（例）事業者からの回答を確認 金曜 #仕事 @待ち','（例）週の振り返りを書く 毎週金曜 17時 #仕事','（例）ゴルフ練習場を予約 土曜 #プライベート @電話','（例）このタスクをタップすると詳細を編集できます p3'];
  lines.forEach((ln,i)=>{ const r=parseQuick(ln); const labels=r.labelNames.map(ensureLabel); const t=makeTask({title:r.title,projectId:r.projectName?ensureProject(r.projectName):'inbox',due:r.due||'',time:r.time||'',recur:r.recur||null,priority:r.priority||4,labels}); t.order+=i; Persist.putTask(t); Persist.log('add',t,'例'); });
  S.meta.welcomeDone=true; Persist.putMeta(); toast('例のタスクを5件追加しました。不要になったら削除してください'); render();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.ready){ renderChrome(); render(); } });
let lastDay=T(); setInterval(()=>{ if(T()!==lastDay){ lastDay=T(); renderChrome(); render(); } },60000);
boot();

<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ask=w=>{ toast('新しい版があります',()=>{ w.postMessage('skip'); },'更新する',15000); };
    if(reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) ask(w); }); });
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloaded){ reloaded=true; location.reload(); } });
}
</script>
